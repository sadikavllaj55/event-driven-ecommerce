services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./services/api-gateway
    container_name: ecommerce-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: dev-secret-change-me
      ORDER_SERVICE_URL: http://order-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      CART_SERVICE_URL: http://cart-service:8084

    depends_on:
      - order-service
      - user-service
      - product-service
      - cart-service

  order-service:
    build: ./services/order-service
    container_name: ecommerce-order-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce
      PORT: "8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-service
    container_name: ecommerce-inventory-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    container_name: ecommerce-payment-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_LIMIT: "10000"
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  notification-service:
    build: ./services/notification-service
    container_name: ecommerce-notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    container_name: ecommerce-user-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  product-service:
    build: ./services/product-service
    container_name: ecommerce-product-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: "8083"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_HOST: localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy


    
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cart-service:
    build: ./services/cart-service
    container_name: ecommerce-cart-service
    ports:
      - "8084:8084"
    environment:
      REDIS_URL: redis:6379
      ORDER_SERVICE_URL: http://order-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8083
      PORT: "8084"
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
      product-service:
        condition: service_started

  minio:
    image: quay.io/minio/minio:latest
    container_name: ecommerce-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API (S3-compatible)
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
